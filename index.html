<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoPath — Adaptive Personalized English Learning</title>
  <meta name="description" content="Personalized CEFR English learning platform with adaptive placement tests, custom curricula, interactive lessons, AI conversation partner, and smart spaced repetition.">

  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Progressive Web App & iPadOS Standalone Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LingoPath">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2563eb">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="sidebar-container"></div>
    <main id="main-content" class="main-content">
      <div id="app-content">
        <!-- Rendered by SPA Router -->
        <div style="padding: 40px; text-align: center; color: var(--color-neutral-400);">
          Loading LingoPath...
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Service Worker Registration for iPad PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>

  <!-- SPA Application Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
